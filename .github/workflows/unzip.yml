name: Unzip SX Converter V4

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unzip:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Unzip SX Converter V4
        run: |
          unzip -o "SX-CONVERTER-V4-REAL-READY.zip" -d extracted

      - name: Move Project Files to Repository Root
        run: |
          shopt -s dotglob

          if [ -d "extracted/SX-CONVERTER-V4-REAL-READY" ]; then
            cp -R "extracted/SX-CONVERTER-V4-REAL-READY/." .
          else
            cp -R extracted/. .
          fi

      - name: Remove ZIP and Temporary Folder
        run: |
          rm -rf extracted
          rm -f "SX-CONVERTER-V4-REAL-READY.zip"

      - name: Commit Extracted Project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Extract SX Converter V4"
            git push
          fi
