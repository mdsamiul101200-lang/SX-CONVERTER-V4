services:
  - type: web
    name: sx-converter
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: "10000"
      - key: MAX_FILE_SIZE_MB
        value: "100"
      - key: JOB_TIMEOUT_MS
        value: "300000"
      - key: DATA_DIR
        value: "/app/data"
      - key: CORS_ORIGIN
        value: "*"
